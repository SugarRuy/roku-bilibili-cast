name: Publish Roku package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'SugarRuy/roku-bilibili-cast'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the tagged channel
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git checkout --detach "refs/tags/$RELEASE_TAG"
          python3 - <<'PY'
          import os
          from pathlib import Path
          fields = dict(line.split("=", 1) for line in Path("channel/manifest").read_text().splitlines() if "=" in line)
          version = ".".join(fields[key] for key in ("major_version", "minor_version", "build_version"))
          assert os.environ["RELEASE_TAG"] == "v" + version, "Tag and Roku version differ"
          PY
          python3 scripts/package.py "build/roku-bilibili-cast-${RELEASE_TAG}.zip"
          (cd build && sha256sum "roku-bilibili-cast-${RELEASE_TAG}.zip" > SHA256SUMS.txt)
      - name: Create prerelease with installable ZIP
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 0
          fi
          notes="docs/releases/${RELEASE_TAG}.md"
          test -f "$notes"
          gh release create "$RELEASE_TAG" "build/roku-bilibili-cast-${RELEASE_TAG}.zip" build/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "Roku小电视 $RELEASE_TAG（预发布版）" \
            --notes-file "$notes"
